<!doctype html>
<html lang="pt-PT" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raíssa Moriá • Portfolio</title>
    <meta name="description" content="Raíssa Moriá — Minimalist, editorial UX/UI & Product Design portfolio." />
    <meta property="og:title" content="Raíssa Moriá • Portfolio" />
    <meta property="og:description" content="Raíssa Moriá — Minimalist, editorial UX/UI & Product Design portfolio." />
    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" 
      rel="stylesheet" 
    />
    <script>
      (function() {
        try {
          var p = localStorage.getItem('portfolio_color_palette_v2') || localStorage.getItem('portfolio_color_palette_v1') || 'original';
          if (p === 'default') p = 'original';
          var m = localStorage.getItem('portfolio_theme_mode_v2') || localStorage.getItem('portfolio_theme_mode_v1') || 'dark';
          document.documentElement.setAttribute('data-theme', p);
          document.documentElement.setAttribute('data-mode', m);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
